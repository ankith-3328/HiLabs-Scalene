[project]
name = "hilabs-scalene"
version = "0.1.0"
description = "Centene price transparency: network mapping and rate file extraction to CSV and Excel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ijson>=3.6.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "streamlit>=1.66.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
